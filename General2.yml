name: General Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board auswaehlen'
        required: true
        type: choice
        options:
          - 'esp8266:esp8266:generic:eesz=4M2M'
          - 'esp8266:esp8266:generic:eesz=4M1M'
          - 'esp8266:esp8266:generic:eesz=1M512'
          - 'esp8266:esp8266:esp8285:eesz=1M512'
  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - fqbn: 'esp8266:esp8266:generic:eesz=4M2M'
            core_version: '3.1.2'
            flash_test: ''
          - fqbn: 'esp8266:esp8266:generic:eesz=4M1M'
            core_version: '3.1.2'
            flash_test: ''
          - fqbn: 'esp8266:esp8266:generic:eesz=1M512'
            core_version: '3.1.2'
            flash_test: ''
          - fqbn: 'esp8266:esp8266:esp8285:eesz=1M512'
            core_version: '3.1.2'
            flash_test: ''
          # Test 1: vorhandener Core mit 2M1M-Linker-Skript
          - fqbn: 'esp8266:esp8266:generic:eesz=4M1M'
            core_version: '3.1.2'
            flash_test: '2M1M'
          # Test 2: aelterer Core mit 2M1M-Linker-Skript
          - fqbn: 'esp8266:esp8266:generic:eesz=4M1M'
            core_version: '2.7.4'
            flash_test: '2M1M'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Arduino-cli and ESP8266 core
        shell: bash
        env:
          CORE_VERSION: ${{ matrix.core_version }}
        run: |
          set -euo pipefail
          wget -O arduino-cli.deb https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
          sudo dpkg -i arduino-cli.deb
          sudo apt --fix-broken install -y
          sudo dpkg --configure -a
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json
          arduino-cli core update-index
          arduino-cli core install "esp8266:esp8266@${CORE_VERSION}"
          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "PubSubClient"
          mkdir -p ~/Arduino/libraries
          git clone --depth 1 --branch 1.14.1 https://github.com/adafruit/RTClib.git ~/Arduino/libraries/RTClib

      - name: Select latest firmware source
        id: source
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t INO_FILES < <(find . -maxdepth 1 -type f -name '*.ino' -printf '%f\n' | sort)
          if [[ -f wifi_monitor.ino ]]; then
            SELECTED=wifi_monitor.ino
          else
            [[ ${#INO_FILES[@]} -gt 0 ]] || { echo "::error::Keine INO-Datei gefunden."; exit 1; }
            SELECTED=""
            SELECTED_TIMESTAMP=0
            for FILE in "${INO_FILES[@]}"; do
              TIMESTAMP=$(git log -1 --format=%ct -- "$FILE" || true)
              [[ -n "$TIMESTAMP" ]] || TIMESTAMP=0
              if [[ -z "$SELECTED" ]] || (( TIMESTAMP > SELECTED_TIMESTAMP )) || { (( TIMESTAMP == SELECTED_TIMESTAMP )) && [[ "$FILE" > "$SELECTED" ]]; }; then
                SELECTED="$FILE"; SELECTED_TIMESTAMP="$TIMESTAMP"
              fi
            done
          fi
          VERSION=$(sed -n 's/^#define FIRMWARE_VERSION "\([^"]*\)".*/\1/p' "$SELECTED" | head -n 1)
          [[ -n "$VERSION" ]] || { echo "::error::FIRMWARE_VERSION fehlt in $SELECTED."; exit 1; }
          if [[ "$SELECTED" =~ ^wifi-monitor_([0-9]{6}[a-z])\.ino$ ]]; then
            [[ "$VERSION" == "${BASH_REMATCH[1]}" ]] || { echo "::error::Dateiname und FIRMWARE_VERSION stimmen nicht ueberein."; exit 1; }
          fi
          echo "Ausgewaehlte Quelldatei: $SELECTED"
          echo "source_file=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated build directory
        env:
          SELECTED_SOURCE: ${{ steps.source.outputs.source_file }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf build-src firmware
          mkdir -p build-src/arduino firmware
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='*.ino' ./ build-src/arduino/
          cp "$SELECTED_SOURCE" build-src/arduino/arduino.ino
          mapfile -t BUILD_INO_FILES < <(find build-src -type f -name '*.ino')
          [[ ${#BUILD_INO_FILES[@]} -eq 1 ]] || { echo "::error::Build-Verzeichnis enthaelt nicht genau eine INO-Datei."; exit 1; }

      - name: Compile firmware and report metrics
        id: compile
        shell: bash
        env:
          FQBN: ${{ matrix.fqbn }}
          CORE_VERSION: ${{ matrix.core_version }}
          FLASH_TEST: ${{ matrix.flash_test }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.source.outputs.version }}"
          BUILD_LOCAL="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S')"
          BUILD_TZ_ABBR="$(TZ=Europe/Berlin date '+%Z')"
          [[ "$BUILD_TZ_ABBR" == CEST ]] && BUILD_TZ_LABEL=MESZ || BUILD_TZ_LABEL=MEZ
          BUILD_TIMESTAMP="$BUILD_LOCAL $BUILD_TZ_LABEL"
          case "$FQBN" in
            esp8266:esp8266:esp8285:eesz=1M512) BOARD_NAME=ESP8285-1M512; BUILD_FLAGS='-DWIFI_MONITOR_SMALL_FLASH -DWIFI_MONITOR_DISABLE_RAM_ANALYSIS'; LINKER_PATTERN=eagle.flash.1m512.ld ;;
            esp8266:esp8266:generic:eesz=1M512) BOARD_NAME=ESP8266-1M512; BUILD_FLAGS='-DWIFI_MONITOR_SMALL_FLASH -DWIFI_MONITOR_DISABLE_RAM_ANALYSIS'; LINKER_PATTERN=eagle.flash.1m512.ld ;;
            esp8266:esp8266:generic:eesz=4M1M) BOARD_NAME=ESP8266-4M1M; BUILD_FLAGS='-DWIFI_MONITOR_DISABLE_RAM_ANALYSIS'; LINKER_PATTERN=eagle.flash.4m1m.ld ;;
            esp8266:esp8266:generic:eesz=4M2M) BOARD_NAME=ESP8266-4M2M; BUILD_FLAGS='-DWIFI_MONITOR_ENABLE_RAM_ANALYSIS'; LINKER_PATTERN=eagle.flash.4m2m.ld ;;
            *) echo "::error::Unbekannte Board-Konfiguration: $FQBN"; exit 1 ;;
          esac
          if [[ "$FLASH_TEST" == 2M1M ]]; then
            LINKER_PATTERN=eagle.flash.2m1m.ld
            BOARD_NAME="ESP8266-2M1M-Core-${CORE_VERSION}"
            BUILD_FLAGS='-DWIFI_MONITOR_DISABLE_RAM_ANALYSIS'
          fi
          LINKER_SCRIPT=$(find "$HOME/.arduino15/packages/esp8266" -type f -name "$LINKER_PATTERN" -print -quit)
          [[ -n "$LINKER_SCRIPT" ]] || { echo "::error::Linker-Skript $LINKER_PATTERN nicht gefunden (Core $CORE_VERSION)."; exit 1; }
          IROM_LEN_HEX=$(grep -E 'irom0_0_seg[[:space:]]*:' "$LINKER_SCRIPT" | sed -n 's/.*len[[:space:]]*=[[:space:]]*0x\([0-9A-Fa-f][0-9A-Fa-f]*\).*/\1/p' | head -n 1)
          [[ -n "$IROM_LEN_HEX" ]] || { echo "::error::IROM-Laenge nicht lesbar."; exit 1; }
          IROM_CAPACITY=$((16#$IROM_LEN_HEX))
          IRAM_BASE=$((16#40100000)); IRAM_CAPACITY=$((16#8000)); IRAM_LIMIT=$((IRAM_BASE + IRAM_CAPACITY))
          cat > build-src/arduino/build_metadata.h <<META
          #ifndef WIFI_MONITOR_BUILD_METADATA_H
          #define WIFI_MONITOR_BUILD_METADATA_H
          #define FIRMWARE_BUILD_DATE "$BUILD_TIMESTAMP"
          #endif
          META
          SIZE_TOOL=$(find "$HOME/.arduino15/packages/esp8266/tools" -type f -name xtensa-lx106-elf-size -perm -u+x -print -quit)
          OBJDUMP_TOOL=$(find "$HOME/.arduino15/packages/esp8266/tools" -type f -name xtensa-lx106-elf-objdump -perm -u+x -print -quit)
          [[ -n "$SIZE_TOOL" && -n "$OBJDUMP_TOOL" ]] || { echo "::error::ESP8266 size/objdump-Tool nicht gefunden."; exit 1; }
          iram_bytes_from_elf() {
            local report index section size_hex vma_hex size addr total=0
            report=$("$OBJDUMP_TOOL" -h "$1")
            while read -r index section size_hex vma_hex _; do
              [[ "$index" =~ ^[0-9]+$ && "$size_hex" =~ ^[0-9A-Fa-f]+$ && "$vma_hex" =~ ^[0-9A-Fa-f]+$ ]] || continue
              size=$((16#$size_hex)); addr=$((16#$vma_hex))
              if (( addr >= IRAM_BASE && addr < IRAM_LIMIT )); then total=$((total + size)); fi
            done <<< "$report"
            echo "$total"
          }
          BIN_BYTES=0; IRAM_BYTES=0; DATA_BYTES=0; RODATA_BYTES=0; BSS_BYTES=0; IROM_BYTES=0
          write_metrics_header() {
            cat > build-src/arduino/build_metrics.h <<METRICS
          #ifndef WIFI_MONITOR_BUILD_METRICS_H
          #define WIFI_MONITOR_BUILD_METRICS_H
          #define BUILD_METRIC_BIN_BYTES ${BIN_BYTES}UL
          #define BUILD_METRIC_IRAM_CODE_BYTES ${IRAM_BYTES}UL
          #define BUILD_METRIC_DATA_BYTES ${DATA_BYTES}UL
          #define BUILD_METRIC_RODATA_BYTES ${RODATA_BYTES}UL
          #define BUILD_METRIC_BSS_BYTES ${BSS_BYTES}UL
          #define BUILD_METRIC_IROM_BYTES ${IROM_BYTES}UL
          #define BUILD_METRIC_IROM_CAPACITY_BYTES ${IROM_CAPACITY}UL
          #endif
          METRICS
          }
          write_metrics_header
          BUILD_PATH="$PWD/build-work"
          for PASS in 1 2 3 4; do
            rm -rf "$BUILD_PATH" firmware; mkdir -p firmware
            COMPILE_ARGS=(--fqbn "$FQBN" --clean --verbose --build-path "$BUILD_PATH" --output-dir firmware --build-property "compiler.cpp.extra_flags=$BUILD_FLAGS")
            if [[ "$FLASH_TEST" == 2M1M ]]; then
              COMPILE_ARGS+=(--build-property build.flash_ld=eagle.flash.2m1m.ld --build-property build.flash_size=2M)
            fi
            arduino-cli compile "${COMPILE_ARGS[@]}" build-src/arduino 2>&1 | tee "firmware/compile-pass-${PASS}.log"
            ELF="$BUILD_PATH/arduino.ino.elf"; BIN_PATH=firmware/arduino.ino.bin
            [[ -s "$ELF" && -s "$BIN_PATH" ]] || { echo "::error::ELF oder BIN fehlt nach Pass $PASS."; exit 1; }
            SIZE_REPORT=$("$SIZE_TOOL" -A "$ELF")
            section_bytes() { awk -v wanted="$1" '$1 == wanted && $2 ~ /^[0-9]+$/ { total += $2 } END { print total+0 }' <<< "$SIZE_REPORT"; }
            NEW_IRAM=$(iram_bytes_from_elf "$ELF"); NEW_DATA=$(section_bytes .data); NEW_RODATA=$(section_bytes .rodata); NEW_BSS=$(section_bytes .bss); NEW_IROM=$(section_bytes .irom0.text); NEW_BIN=$(stat -c '%s' "$BIN_PATH")
            if [[ "$NEW_BIN" == "$BIN_BYTES" && "$NEW_IRAM" == "$IRAM_BYTES" && "$NEW_DATA" == "$DATA_BYTES" && "$NEW_RODATA" == "$RODATA_BYTES" && "$NEW_BSS" == "$BSS_BYTES" && "$NEW_IROM" == "$IROM_BYTES" ]]; then break; fi
            BIN_BYTES=$NEW_BIN; IRAM_BYTES=$NEW_IRAM; DATA_BYTES=$NEW_DATA; RODATA_BYTES=$NEW_RODATA; BSS_BYTES=$NEW_BSS; IROM_BYTES=$NEW_IROM
            write_metrics_header
            [[ "$PASS" != 4 ]] || { echo "::error::Messwerte stabilisierten sich nach vier Durchlaeufen nicht."; exit 1; }
          done
          BIN="firmware/WiFi-Monitor_v${VERSION}_${BOARD_NAME}.bin"
          mv firmware/arduino.ino.bin "$BIN"
          test -s "$BIN"
          echo "Finale Firmware und Messwerte:"; ls -lh "$BIN"; cat build-src/arduino/build_metrics.h
          echo "bin_file=$BIN" >> "$GITHUB_OUTPUT"
          echo "board_name=$BOARD_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIN_FILE: ${{ steps.compile.outputs.bin_file }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          [[ -n "${BIN_FILE:-}" ]] || { echo "::error::Kein BIN-Dateiname ausgegeben."; exit 1; }
          [[ -s "$BIN_FILE" ]] || { echo "::error::Firmware fehlt oder ist leer: $BIN_FILE"; exit 1; }
          if [[ "$EVENT_NAME" == release ]]; then
            TARGET_TAG="$RELEASE_TAG"
          else
            TARGET_TAG=$(gh release list --repo "$REPOSITORY" --limit 100 --json tagName,isDraft,isPrerelease,publishedAt --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | last | .tagName // empty')
            [[ -n "$TARGET_TAG" ]] || { echo "::error::Kein veröffentlichtes stabiles Release gefunden."; exit 1; }
          fi
          echo "Ziel-Release: $TARGET_TAG"
          gh release upload "$TARGET_TAG" "$BIN_FILE" --repo "$REPOSITORY" --clobber
          echo "Firmware erfolgreich zum Release hochgeladen."
