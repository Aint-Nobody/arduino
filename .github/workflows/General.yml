name: General Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board auswaehlen'
        required: true
        type: choice
        options:
          - 'esp8266:esp8266:generic:eesz=4M2M'
          - 'esp8266:esp8266:generic:eesz=4M1M'
          - 'esp8266:esp8266:generic:eesz=1M512'
          - 'esp8266:esp8266:esp8285:eesz=1M512'

  release:
    types: [published]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"fqbn":"{0}"}}]', github.event.inputs.board) || '[{"fqbn":"esp8266:esp8266:generic:eesz=4M2M"},{"fqbn":"esp8266:esp8266:generic:eesz=4M1M"},{"fqbn":"esp8266:esp8266:generic:eesz=1M512"},{"fqbn":"esp8266:esp8266:esp8285:eesz=1M512"}]') }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Arduino-cli
        shell: bash
        run: |
          set -euo pipefail

          wget -O arduino-cli.deb \
            https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb

          sudo dpkg -i arduino-cli.deb
          sudo apt --fix-broken install -y
          sudo dpkg --configure -a

          arduino-cli config init
          arduino-cli config add board_manager.additional_urls \
            https://arduino.esp8266.com/stable/package_esp8266com_index.json

          arduino-cli core update-index
          arduino-cli core install esp8266:esp8266

          arduino-cli lib install "ArduinoJson"
          arduino-cli lib install "PubSubClient"

          mkdir -p ~/Arduino/libraries

          git clone --depth 1 --branch 1.14.1 \
            https://github.com/adafruit/RTClib.git \
            ~/Arduino/libraries/RTClib

      - name: Select latest firmware source
        id: source
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t INO_FILES < <(
            find . -maxdepth 1 -type f -name '*.ino' \
              -printf '%f\n' | sort
          )

          if [[ -f "wifi_monitor.ino" ]]; then
            SELECTED="wifi_monitor.ino"
            echo "Standarddatei hat Vorrang: $SELECTED"
          else
            if [[ ${#INO_FILES[@]} -eq 0 ]]; then
              echo "::error::Keine INO-Datei im Hauptverzeichnis gefunden."
              exit 1
            fi

            SELECTED=""
            SELECTED_TIMESTAMP=0

            for FILE in "${INO_FILES[@]}"; do
              TIMESTAMP=$(git log -1 --format=%ct -- "$FILE" || true)

              if [[ -z "$TIMESTAMP" ]]; then
                TIMESTAMP=0
              fi

              if [[ -z "$SELECTED" ]] || \
                 (( TIMESTAMP > SELECTED_TIMESTAMP )) || \
                 { (( TIMESTAMP == SELECTED_TIMESTAMP )) && [[ "$FILE" > "$SELECTED" ]]; }; then
                SELECTED="$FILE"
                SELECTED_TIMESTAMP="$TIMESTAMP"
              fi
            done

            if [[ -z "$SELECTED" ]]; then
              echo "::error::Keine geeignete INO-Datei gefunden."
              exit 1
            fi
          fi

          VERSION=$(sed -n \
            's/^#define FIRMWARE_VERSION "\([^"]*\)".*/\1/p' \
            "$SELECTED" | head -n 1)

          if [[ -z "$VERSION" ]]; then
            echo "::error::FIRMWARE_VERSION fehlt in $SELECTED."
            exit 1
          fi

          if [[ "$SELECTED" =~ ^wifi-monitor_([0-9]{6}[a-z])\.ino$ ]]; then
            FILE_VERSION="${BASH_REMATCH[1]}"
            if [[ "$VERSION" != "$FILE_VERSION" ]]; then
              echo "::error::Dateiname ($FILE_VERSION) und FIRMWARE_VERSION ($VERSION) stimmen nicht ueberein."
              exit 1
            fi
          fi

          echo "Ausgewählte Quelldatei: $SELECTED"
          echo "Firmware-Version: $VERSION"

          echo "source_file=$SELECTED" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Prepare isolated build directory
        shell: bash
        env:
          SELECTED_SOURCE: ${{ steps.source.outputs.source_file }}
        run: |
          set -euo pipefail

          rm -rf build-src firmware

          mkdir -p build-src/arduino firmware

          # Alle Projektdateien außer anderen INO-Dateien übernehmen.
          # Die ausgewählte INO-Datei wird anschließend separat kopiert.
          rsync -a \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='*.ino' \
            ./ build-src/arduino/

          cp "$SELECTED_SOURCE" build-src/arduino/arduino.ino

          echo "Verwendete Quelldatei: $SELECTED_SOURCE"

          mapfile -t BUILD_INO_FILES < <(
            find build-src -type f -name '*.ino'
          )

          if [[ ${#BUILD_INO_FILES[@]} -ne 1 ]]; then
            echo "::error::Das Build-Verzeichnis enthält nicht genau eine INO-Datei."
            exit 1
          fi

          echo "Isoliertes Build-Verzeichnis geprüft."

      - name: Compile firmware, extract metrics, embed and verify final metrics
        id: compile
        shell: bash
        env:
          FQBN: ${{ matrix.board.fqbn }}
        run: |
          set -euo pipefail

          VERSION="${{ steps.source.outputs.version }}"
          BUILD_LOCAL="$(TZ=Europe/Berlin date '+%Y-%m-%d %H:%M:%S')"
          BUILD_TZ_ABBR="$(TZ=Europe/Berlin date '+%Z')"
          if [[ "$BUILD_TZ_ABBR" == "CEST" ]]; then BUILD_TZ_LABEL="MESZ"; else BUILD_TZ_LABEL="MEZ"; fi
          BUILD_TIMESTAMP="$BUILD_LOCAL $BUILD_TZ_LABEL"
          printf 'Build-Zeitpunkt: %s\n' "$BUILD_TIMESTAMP"
          printf 'Firmware-Version: %s\nBoard: %s\n' "$VERSION" "$FQBN"

          case "$FQBN" in
            esp8266:esp8266:esp8285:eesz=1M512) BOARD_NAME="ESP8285-1M512"; BUILD_FLAGS="-DWIFI_MONITOR_SMALL_FLASH -DWIFI_MONITOR_DISABLE_RAM_ANALYSIS"; LINKER_PATTERN='eagle.flash.1m512.ld' ;;
            esp8266:esp8266:generic:eesz=1M512) BOARD_NAME="ESP8266-1M512"; BUILD_FLAGS="-DWIFI_MONITOR_SMALL_FLASH -DWIFI_MONITOR_DISABLE_RAM_ANALYSIS"; LINKER_PATTERN='eagle.flash.1m512.ld' ;;
            esp8266:esp8266:generic:eesz=4M1M) BOARD_NAME="ESP8266-4M1M"; BUILD_FLAGS="-DWIFI_MONITOR_DISABLE_RAM_ANALYSIS"; LINKER_PATTERN='eagle.flash.4m1m.ld' ;;
            esp8266:esp8266:generic:eesz=4M2M) BOARD_NAME="ESP8266-4M2M"; BUILD_FLAGS="-DWIFI_MONITOR_ENABLE_RAM_ANALYSIS"; LINKER_PATTERN='eagle.flash.4m2m.ld' ;;
            *) echo "::error::Unbekannte Board-Konfiguration: $FQBN"; exit 1 ;;
          esac

          LINKER_SCRIPT="$(find "$HOME/.arduino15/packages/esp8266" -type f -name "$LINKER_PATTERN" -print -quit)"
          if [[ -z "$LINKER_SCRIPT" ]]; then
            echo "::error::Linker-Skript $LINKER_PATTERN wurde nicht gefunden."
            exit 1
          fi
          IROM_LEN_HEX="$(grep -E 'irom0_0_seg[[:space:]]*:' "$LINKER_SCRIPT" | sed -n 's/.*len[[:space:]]*=[[:space:]]*0x\([0-9A-Fa-f][0-9A-Fa-f]*\).*/\1/p' | head -n 1)"
          if [[ -z "$IROM_LEN_HEX" ]]; then
            echo "::error::IROM-Laenge konnte nicht aus $LINKER_SCRIPT gelesen werden."
            exit 1
          fi
          IROM_CAPACITY=$((16#$IROM_LEN_HEX))
          if [[ "$IROM_CAPACITY" -le 0 ]]; then
            echo "::error::IROM-Kapazitaet konnte nicht aus $LINKER_SCRIPT gelesen werden."
            exit 1
          fi
          echo "IROM-Kapazitaet laut Linker-Skript $LINKER_PATTERN: $IROM_CAPACITY Byte"

          # ESP8266-Anwendungs-IRAM: 32 KiB bei 0x40100000..0x40108000.
          # In ESP8266 Core 3.1.2 ist eagle.app.v6.common.ld nicht vorhanden;
          # das einzige iram1_0_seg in den installierten .ld-Dateien liegt in
          # bootloaders/eboot/eboot.ld und beschreibt nur den Bootloader.
          # Deshalb nicht aus diesem falschen Skript ableiten.
          IRAM_BASE=$((16#40100000))
          IRAM_CAPACITY=$((16#8000))
          IRAM_LIMIT=$((IRAM_BASE + IRAM_CAPACITY))
          printf 'IRAM-Anwendungsbereich: 0x%x bis 0x%x (%s Byte)\n' \
            "$IRAM_BASE" "$IRAM_LIMIT" "$IRAM_CAPACITY"

          cat > build-src/arduino/build_metadata.h <<EOF
          #ifndef WIFI_MONITOR_BUILD_METADATA_H
          #define WIFI_MONITOR_BUILD_METADATA_H
          #define FIRMWARE_BUILD_DATE "$BUILD_TIMESTAMP"
          #endif
          EOF

          METRICS_HEADER="build-src/arduino/build_metrics.h"
          write_metrics_header() {
            cat > "$METRICS_HEADER" <<EOF
          #ifndef WIFI_MONITOR_BUILD_METRICS_H
          #define WIFI_MONITOR_BUILD_METRICS_H
          #define BUILD_METRIC_BIN_BYTES ${BIN_BYTES}UL
          #define BUILD_METRIC_IRAM_CODE_BYTES ${IRAM_BYTES}UL
          #define BUILD_METRIC_DATA_BYTES ${DATA_BYTES}UL
          #define BUILD_METRIC_RODATA_BYTES ${RODATA_BYTES}UL
          #define BUILD_METRIC_BSS_BYTES ${BSS_BYTES}UL
          #define BUILD_METRIC_IROM_BYTES ${IROM_BYTES}UL
          #define BUILD_METRIC_IROM_CAPACITY_BYTES ${IROM_CAPACITY}UL
          #endif
          EOF
          }

          # Find the exact ESP8266 size utility installed by the core.
          SIZE_TOOL="$(find "$HOME/.arduino15/packages/esp8266/tools" -type f -name 'xtensa-lx106-elf-size' -perm -u+x -print -quit)"
          OBJDUMP_TOOL="$(find "$HOME/.arduino15/packages/esp8266/tools" -type f -name 'xtensa-lx106-elf-objdump' -perm -u+x -print -quit)"
          if [[ -z "$SIZE_TOOL" ]]; then
            echo "::error::xtensa-lx106-elf-size wurde in der installierten ESP8266-Toolchain nicht gefunden."
            exit 1
          fi
          if [[ -z "$OBJDUMP_TOOL" ]]; then
            echo "::error::xtensa-lx106-elf-objdump wurde in der installierten ESP8266-Toolchain nicht gefunden."
            exit 1
          fi

          iram_bytes_from_elf() {
            local elf="$1" report index section size_hex vma_hex size addr total=0
            report="$("$OBJDUMP_TOOL" -h "$elf")"
            while read -r index section size_hex vma_hex _; do
              [[ "$index" =~ ^[0-9]+$ ]] || continue
              [[ "$size_hex" =~ ^[0-9A-Fa-f]+$ && "$vma_hex" =~ ^[0-9A-Fa-f]+$ ]] || continue
              size=$((16#$size_hex))
              addr=$((16#$vma_hex))
              if (( addr >= IRAM_BASE && addr < IRAM_LIMIT )); then
                total=$((total + size))
              fi
            done <<< "$report"
            printf '%s\n' "$total"
          }

          # Initialize numeric placeholders. Each pass compiles the exact same
          # metric-reporting code; measured values are then embedded and rebuilt.
          BIN_BYTES=0; IRAM_BYTES=0; DATA_BYTES=0; RODATA_BYTES=0; BSS_BYTES=0; IROM_BYTES=0
          write_metrics_header

          BUILD_PATH="$PWD/build-work"
          for PASS in 1 2 3 4; do
            rm -rf "$BUILD_PATH" firmware
            mkdir -p firmware
            LOG="firmware/compile-pass-${PASS}.log"
            arduino-cli compile \
              --fqbn "$FQBN" \
              --clean \
              --verbose \
              --build-path "$BUILD_PATH" \
              --output-dir firmware \
              --build-property compiler.cpp.extra_flags="$BUILD_FLAGS" \
              build-src/arduino 2>&1 | tee "$LOG"

            ELF="$BUILD_PATH/arduino.ino.elf"
            BIN_PATH="firmware/arduino.ino.bin"
            if [[ ! -s "$ELF" || ! -s "$BIN_PATH" ]]; then
              echo "::error::ELF oder BIN fehlt nach Build-Pass $PASS."
              find "$BUILD_PATH" firmware -maxdepth 3 -type f -printf '%p (%s Byte)\n'
              exit 1
            fi

            # Read section sizes directly from the final linked ELF.
            SIZE_REPORT="$($SIZE_TOOL -A "$ELF")"
            section_bytes() {
              local name="$1"
              awk -v wanted="$name" '$1 == wanted && $2 ~ /^[0-9]+$/ { total += $2 } END { print total+0 }' <<< "$SIZE_REPORT"
            }
            NEW_IRAM="$(iram_bytes_from_elf "$ELF")"
            NEW_DATA="$(section_bytes .data)"
            NEW_RODATA="$(section_bytes .rodata)"
            NEW_BSS="$(section_bytes .bss)"
            NEW_IROM="$(section_bytes .irom0.text)"
            NEW_BIN="$(stat -c '%s' "$BIN_PATH")"

            if ! [[ "$NEW_IRAM$NEW_DATA$NEW_RODATA$NEW_BSS$NEW_IROM$NEW_BIN" =~ ^[0-9]+$ ]]; then
              echo "::error::Mindestens ein Messwert ist nicht numerisch."
              exit 1
            fi

            printf 'Build-Pass %s: BIN=%s, IRAM=%s, DATA=%s, RODATA=%s, BSS=%s, IROM=%s/%s Byte\n' \
              "$PASS" "$NEW_BIN" "$NEW_IRAM" "$NEW_DATA" "$NEW_RODATA" "$NEW_BSS" "$NEW_IROM" "$IROM_CAPACITY"

            if [[ "$NEW_BIN" == "$BIN_BYTES" && "$NEW_IRAM" == "$IRAM_BYTES" && "$NEW_DATA" == "$DATA_BYTES" && "$NEW_RODATA" == "$RODATA_BYTES" && "$NEW_BSS" == "$BSS_BYTES" && "$NEW_IROM" == "$IROM_BYTES" ]]; then
              echo "Messwerte stimmen mit dem eingebetteten Header ueberein; finaler Build verifiziert."
              break
            fi

            BIN_BYTES="$NEW_BIN"; IRAM_BYTES="$NEW_IRAM"; DATA_BYTES="$NEW_DATA"; RODATA_BYTES="$NEW_RODATA"; BSS_BYTES="$NEW_BSS"; IROM_BYTES="$NEW_IROM"
            write_metrics_header
            if [[ "$PASS" == 4 ]]; then
              echo "::error::Build-Messwerte haben sich nach vier Durchlaeufen nicht stabilisiert."
              exit 1
            fi
          done

          # Verify the final ELF/BIN against the header values after the last compile.
          FINAL_SIZE_REPORT="$($SIZE_TOOL -A "$BUILD_PATH/arduino.ino.elf")"
          final_section_bytes() { awk -v wanted="$1" '$1 == wanted && $2 ~ /^[0-9]+$/ { total += $2 } END { print total+0 }' <<< "$FINAL_SIZE_REPORT"; }
          FINAL_BIN_BYTES="$(stat -c '%s' firmware/arduino.ino.bin)"
          [[ "$FINAL_BIN_BYTES" == "$BIN_BYTES" ]] || { echo "::error::Finale BIN-Groesse weicht vom eingebetteten Wert ab."; exit 1; }
          [[ "$(iram_bytes_from_elf "$BUILD_PATH/arduino.ino.elf")" == "$IRAM_BYTES" ]] || { echo "::error::Finaler IRAM-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .data)" == "$DATA_BYTES" ]] || { echo "::error::Finaler DATA-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .rodata)" == "$RODATA_BYTES" ]] || { echo "::error::Finaler RODATA-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .bss)" == "$BSS_BYTES" ]] || { echo "::error::Finaler BSS-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .irom0.text)" == "$IROM_BYTES" ]] || { echo "::error::Finaler IROM-Wert weicht ab."; exit 1; }

          BIN="firmware/WiFi-Monitor_v${VERSION}_${BOARD_NAME}.bin"
          mv firmware/arduino.ino.bin "$BIN"
          test -s "$BIN"
          echo "Finale Firmware und Messwerte:"; ls -lh "$BIN"
          cat "$METRICS_HEADER"
          echo "bin_file=$BIN" >> "$GITHUB_OUTPUT"
          echo "board_name=$BOARD_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIN_FILE: ${{ steps.compile.outputs.bin_file }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Verhindert einen Upload mit leerem Dateinamen.
          if [[ -z "${BIN_FILE:-}" ]]; then
            echo "::error::Der Kompilierungsschritt hat keinen BIN-Dateinamen ausgegeben."
            exit 1
          fi

          if [[ ! -s "$BIN_FILE" ]]; then
            echo "::error::Die Firmware-Datei fehlt oder ist leer: $BIN_FILE"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "release" ]]; then
            TARGET_TAG="$RELEASE_TAG"
          else
            # Bei einem manuellen Build das neueste veröffentlichte
            # GitHub-Release als Upload-Ziel verwenden.
            TARGET_TAG=$(gh release list \
              --repo "$REPOSITORY" \
              --limit 100 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | last | .tagName // empty')

            if [[ -z "$TARGET_TAG" ]]; then
              echo "::error::Kein veröffentlichtes stabiles Release gefunden."
              echo "Bitte zuerst ein Release veröffentlichen."
              exit 1
            fi
          fi

          echo "Ziel-Release: $TARGET_TAG"
          echo "Firmware: $BIN_FILE"

          gh release upload "$TARGET_TAG" "$BIN_FILE" \
            --repo "$REPOSITORY" \
            --clobber

          echo "Firmware erfolgreich zum Release hochgeladen."
YTES ${BSS_BYTES}UL
          #define BUILD_METRIC_IROM_BYTES ${IROM_BYTES}UL
          #define BUILD_METRIC_IROM_CAPACITY_BYTES ${IROM_CAPACITY}UL
          #endif
          EOF
          }

          # Find the exact ESP8266 size utility installed by the core.
          SIZE_TOOL="$(find "$HOME/.arduino15/packages/esp8266/tools" -type f -name 'xtensa-lx106-elf-size' -perm -u+x -print -quit)"
          OBJDUMP_TOOL="$(find "$HOME/.arduino15/packages/esp8266/tools" -type f -name 'xtensa-lx106-elf-objdump' -perm -u+x -print -quit)"
          if [[ -z "$SIZE_TOOL" ]]; then
            echo "::error::xtensa-lx106-elf-size wurde in der installierten ESP8266-Toolchain nicht gefunden."
            exit 1
          fi
          if [[ -z "$OBJDUMP_TOOL" ]]; then
            echo "::error::xtensa-lx106-elf-objdump wurde in der installierten ESP8266-Toolchain nicht gefunden."
            exit 1
          fi

          iram_bytes_from_elf() {
            local elf="$1" report index section size_hex vma_hex size addr total=0
            report="$("$OBJDUMP_TOOL" -h "$elf")"
            while read -r index section size_hex vma_hex _; do
              [[ "$index" =~ ^[0-9]+$ ]] || continue
              [[ "$size_hex" =~ ^[0-9A-Fa-f]+$ && "$vma_hex" =~ ^[0-9A-Fa-f]+$ ]] || continue
              size=$((16#$size_hex))
              addr=$((16#$vma_hex))
              if (( addr >= IRAM_BASE && addr < IRAM_LIMIT )); then
                total=$((total + size))
              fi
            done <<< "$report"
            printf '%s\n' "$total"
          }

          # Initialize numeric placeholders. Each pass compiles the exact same
          # metric-reporting code; measured values are then embedded and rebuilt.
          BIN_BYTES=0; IRAM_BYTES=0; DATA_BYTES=0; RODATA_BYTES=0; BSS_BYTES=0; IROM_BYTES=0
          write_metrics_header

          BUILD_PATH="$PWD/build-work"
          for PASS in 1 2 3 4; do
            rm -rf "$BUILD_PATH" firmware
            mkdir -p firmware
            LOG="firmware/compile-pass-${PASS}.log"
            arduino-cli compile \
              --fqbn "$FQBN" \
              --clean \
              --verbose \
              --build-path "$BUILD_PATH" \
              --output-dir firmware \
              --build-property compiler.cpp.extra_flags="$BUILD_FLAGS" \
              build-src/arduino 2>&1 | tee "$LOG"

            ELF="$BUILD_PATH/arduino.ino.elf"
            BIN_PATH="firmware/arduino.ino.bin"
            if [[ ! -s "$ELF" || ! -s "$BIN_PATH" ]]; then
              echo "::error::ELF oder BIN fehlt nach Build-Pass $PASS."
              find "$BUILD_PATH" firmware -maxdepth 3 -type f -printf '%p (%s Byte)\n'
              exit 1
            fi

            # Read section sizes directly from the final linked ELF.
            SIZE_REPORT="$($SIZE_TOOL -A "$ELF")"
            section_bytes() {
              local name="$1"
              awk -v wanted="$name" '$1 == wanted && $2 ~ /^[0-9]+$/ { total += $2 } END { print total+0 }' <<< "$SIZE_REPORT"
            }
            NEW_IRAM="$(iram_bytes_from_elf "$ELF")"
            NEW_DATA="$(section_bytes .data)"
            NEW_RODATA="$(section_bytes .rodata)"
            NEW_BSS="$(section_bytes .bss)"
            NEW_IROM="$(section_bytes .irom0.text)"
            NEW_BIN="$(stat -c '%s' "$BIN_PATH")"

            if ! [[ "$NEW_IRAM$NEW_DATA$NEW_RODATA$NEW_BSS$NEW_IROM$NEW_BIN" =~ ^[0-9]+$ ]]; then
              echo "::error::Mindestens ein Messwert ist nicht numerisch."
              exit 1
            fi

            printf 'Build-Pass %s: BIN=%s, IRAM=%s, DATA=%s, RODATA=%s, BSS=%s, IROM=%s/%s Byte\n' \
              "$PASS" "$NEW_BIN" "$NEW_IRAM" "$NEW_DATA" "$NEW_RODATA" "$NEW_BSS" "$NEW_IROM" "$IROM_CAPACITY"

            if [[ "$NEW_BIN" == "$BIN_BYTES" && "$NEW_IRAM" == "$IRAM_BYTES" && "$NEW_DATA" == "$DATA_BYTES" && "$NEW_RODATA" == "$RODATA_BYTES" && "$NEW_BSS" == "$BSS_BYTES" && "$NEW_IROM" == "$IROM_BYTES" ]]; then
              echo "Messwerte stimmen mit dem eingebetteten Header ueberein; finaler Build verifiziert."
              break
            fi

            BIN_BYTES="$NEW_BIN"; IRAM_BYTES="$NEW_IRAM"; DATA_BYTES="$NEW_DATA"; RODATA_BYTES="$NEW_RODATA"; BSS_BYTES="$NEW_BSS"; IROM_BYTES="$NEW_IROM"
            write_metrics_header
            if [[ "$PASS" == 4 ]]; then
              echo "::error::Build-Messwerte haben sich nach vier Durchlaeufen nicht stabilisiert."
              exit 1
            fi
          done

          # Verify the final ELF/BIN against the header values after the last compile.
          FINAL_SIZE_REPORT="$($SIZE_TOOL -A "$BUILD_PATH/arduino.ino.elf")"
          final_section_bytes() { awk -v wanted="$1" '$1 == wanted && $2 ~ /^[0-9]+$/ { total += $2 } END { print total+0 }' <<< "$FINAL_SIZE_REPORT"; }
          FINAL_BIN_BYTES="$(stat -c '%s' firmware/arduino.ino.bin)"
          [[ "$FINAL_BIN_BYTES" == "$BIN_BYTES" ]] || { echo "::error::Finale BIN-Groesse weicht vom eingebetteten Wert ab."; exit 1; }
          [[ "$(iram_bytes_from_elf "$BUILD_PATH/arduino.ino.elf")" == "$IRAM_BYTES" ]] || { echo "::error::Finaler IRAM-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .data)" == "$DATA_BYTES" ]] || { echo "::error::Finaler DATA-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .rodata)" == "$RODATA_BYTES" ]] || { echo "::error::Finaler RODATA-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .bss)" == "$BSS_BYTES" ]] || { echo "::error::Finaler BSS-Wert weicht ab."; exit 1; }
          [[ "$(final_section_bytes .irom0.text)" == "$IROM_BYTES" ]] || { echo "::error::Finaler IROM-Wert weicht ab."; exit 1; }

          BIN="firmware/WiFi-Monitor_v${VERSION}_${BOARD_NAME}.bin"
          mv firmware/arduino.ino.bin "$BIN"
          test -s "$BIN"
          echo "Finale Firmware und Messwerte:"; ls -lh "$BIN"
          cat "$METRICS_HEADER"
          echo "bin_file=$BIN" >> "$GITHUB_OUTPUT"
          echo "board_name=$BOARD_NAME" >> "$GITHUB_OUTPUT"

      - name: Upload firmware to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BIN_FILE: ${{ steps.compile.outputs.bin_file }}
          EVENT_NAME: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # Verhindert einen Upload mit leerem Dateinamen.
          if [[ -z "${BIN_FILE:-}" ]]; then
            echo "::error::Der Kompilierungsschritt hat keinen BIN-Dateinamen ausgegeben."
            exit 1
          fi

          if [[ ! -s "$BIN_FILE" ]]; then
            echo "::error::Die Firmware-Datei fehlt oder ist leer: $BIN_FILE"
            exit 1
          fi

          if [[ "$EVENT_NAME" == "release" ]]; then
            TARGET_TAG="$RELEASE_TAG"
          else
            # Bei einem manuellen Build das neueste veröffentlichte
            # GitHub-Release als Upload-Ziel verwenden.
            TARGET_TAG=$(gh release list \
              --repo "$REPOSITORY" \
              --limit 100 \
              --json tagName,isDraft,isPrerelease,publishedAt \
              --jq '[.[] | select(.isDraft == false and .isPrerelease == false)] | sort_by(.publishedAt) | last | .tagName // empty')

            if [[ -z "$TARGET_TAG" ]]; then
              echo "::error::Kein veröffentlichtes stabiles Release gefunden."
              echo "Bitte zuerst ein Release veröffentlichen."
              exit 1
            fi
          fi

          echo "Ziel-Release: $TARGET_TAG"
          echo "Firmware: $BIN_FILE"

          gh release upload "$TARGET_TAG" "$BIN_FILE" \
            --repo "$REPOSITORY" \
            --clobber

          echo "Firmware erfolgreich zum Release hochgeladen."
