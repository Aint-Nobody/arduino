name: General Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board auswaehlen'
        required: true
        type: choice
        options:
          - 'esp8266:esp8266:generic:eesz=4M2M'
          - 'esp8266:esp8266:generic:eesz=4M1M'
          - 'esp8266:esp8266:generic:eesz=1M512'
          - 'esp8266:esp8266:esp8285:eesz=1M512'
  release:
    types: [published]

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"fqbn":"{0}","name":"{0}"}}]', github.event.inputs.board) || '[{"fqbn":"esp8266:esp8266:generic:eesz=4M2M","name":"esp8266-generic-4M2M"},{"fqbn":"esp8266:esp8266:generic:eesz=4M1M","name":"esp8266-generic-4M1M"},{"fqbn":"esp8266:esp8266:generic:eesz=1M512","name":"esp8266-generic-1M512"},{"fqbn":"esp8266:esp8266:esp8285:eesz=1M512","name":"esp8285-1M512"}]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |
        wget -O arduino-cli.deb https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a

        arduino-cli config init

        arduino-cli config add board_manager.additional_urls https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
        arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

        arduino-cli core update-index
        arduino-cli core install esp32:esp32
        arduino-cli core install esp8266:esp8266

        arduino-cli lib install "ArduinoJson"
        arduino-cli lib install "PubSubClient"

        git clone --depth 1 --branch 1.14.1 https://github.com/adafruit/RTClib.git ~/Arduino/libraries/RTClib

    - name: Compile for ${{ matrix.board.name }}
      run: |
        rm -rf firmware
        mkdir -p firmware

        ORIG_INO=$(ls *.ino | head -1)
        SKETCH_NAME="${ORIG_INO%.ino}"
        echo "Original sketch: $SKETCH_NAME"

        mv "$ORIG_INO" arduino.ino

        echo "Compiling for ${{ matrix.board.name }} (${{ matrix.board.fqbn }})..."
        arduino-cli compile --fqbn ${{ matrix.board.fqbn }} --clean --output-dir firmware .

        SAFE_NAME=$(echo "${{ matrix.board.fqbn }}" | tr -c 'a-zA-Z0-9._-' '-')

        for f in firmware/arduino.ino.*; do
          [ -e "$f" ] || continue
          ext="${f##*.}"
          mv "$f" "firmware/${SKETCH_NAME}-${SAFE_NAME}.${ext}"
        done

        echo "---- Firmware-Inhalt ----"
        ls -la firmware/

    - name: Determine release tag
      id: get_tag
      run: |
        if [ "${{ github.event_name }}" == "release" ]; then
          TAG_NAME="${{ github.event.release.tag_name }}"
        else
          TAG_NAME="firmware"
        fi
        echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT

    - name: Upload files to existing release
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ steps.get_tag.outputs.tag_name }}
        files: |
          firmware/*.bin
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
