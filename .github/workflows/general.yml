name: General Build

on:
  workflow_dispatch:
    inputs:
      board:
        description: 'Board auswaehlen'
        required: true
        type: choice
        options:
          - 'esp8266:esp8266:generic:eesz=4M2M'
          - 'esp8266:esp8266:generic:eesz=4M1M'
          - 'esp8266:esp8266:generic:eesz=1M512'
          - 'esp8266:esp8266:esp8285:eesz=1M512'

  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        board: ${{ fromJSON(github.event_name == 'workflow_dispatch' && format('[{{"fqbn":"{0}"}}]', github.event.inputs.board) || '[{"fqbn":"esp8266:esp8266:generic:eesz=4M2M"},{"fqbn":"esp8266:esp8266:generic:eesz=4M1M"},{"fqbn":"esp8266:esp8266:generic:eesz=1M512"},{"fqbn":"esp8266:esp8266:esp8285:eesz=1M512"}]') }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Install Arduino-cli
      run: |
        wget -O arduino-cli.deb https://github.com/arduino/arduino-cli/releases/download/v1.5.1/arduino-cli_1.5.1-1_amd64.deb
        sudo dpkg -i arduino-cli.deb
        sudo apt --fix-broken install -y
        sudo dpkg --configure -a

        arduino-cli config init
        arduino-cli config add board_manager.additional_urls https://arduino.esp8266.com/stable/package_esp8266com_index.json

        arduino-cli core update-index
        arduino-cli core install esp8266:esp8266

        arduino-cli lib install "ArduinoJson"
        arduino-cli lib install "PubSubClient"

        git clone --depth 1 --branch 1.14.1 https://github.com/adafruit/RTClib.git ~/Arduino/libraries/RTClib

    - name: Compile firmware
      id: compile
      shell: bash
      run: |
        set -euo pipefail

        rm -rf firmware
        mkdir -p firmware

        test -f wifi_monitor.ino

        VERSION=$(sed -n 's/^#define FIRMWARE_VERSION "\([^"]*\)".*/\1/p' wifi_monitor.ino | head -n1)
        test -n "$VERSION"

        echo "Firmware version: $VERSION"
        echo "Board: ${{ matrix.board.fqbn }}"

        # Nur im temporaeren Runner wird der Dateiname geaendert.
        # Im Repository bleibt die Datei wifi_monitor.ino.
        mv wifi_monitor.ino arduino.ino

        # Bei 1M512 wird der OTA-Code bereits beim Kompilieren ausgeschlossen.
        if [[ "${{ matrix.board.fqbn }}" == *":eesz=1M512" ]]; then
          echo "Small-flash build: OTA-Code wird ausgeschlossen."

          arduino-cli compile \
            --fqbn "${{ matrix.board.fqbn }}" \
            --clean \
            --output-dir firmware \
            --build-property compiler.cpp.extra_flags=-DWIFI_MONITOR_SMALL_FLASH \
            .
        else
          echo "Normaler Build mit OTA-Unterstuetzung."

          arduino-cli compile \
            --fqbn "${{ matrix.board.fqbn }}" \
            --clean \
            --output-dir firmware \
            .
        fi

        # Boardbezeichnung fuer den Dateinamen festlegen.
        case "${{ matrix.board.fqbn }}" in
          esp8266:esp8266:esp8285:eesz=1M512)
            BOARD_NAME="ESP8285-1M512"
            ;;
          esp8266:esp8266:generic:eesz=1M512)
            BOARD_NAME="ESP8266-1M512"
            ;;
          esp8266:esp8266:generic:eesz=4M1M)
            BOARD_NAME="ESP8266-4M1M"
            ;;
          esp8266:esp8266:generic:eesz=4M2M)
            BOARD_NAME="ESP8266-4M2M"
            ;;
          *)
            echo "Unbekannte Board-Konfiguration."
            exit 1
            ;;
        esac

        # Das erwartete Compiler-Ergebnis muss vorhanden sein.
        test -f firmware/arduino.ino.bin

        BIN="firmware/WiFi-Monitor_v${VERSION}_${BOARD_NAME}.bin"

        mv firmware/arduino.ino.bin "$BIN"

        echo "board_name=$BOARD_NAME" >> "$GITHUB_OUTPUT"
        echo "bin_file=$BIN" >> "$GITHUB_OUTPUT"

        echo "Erzeugte Firmware:"
        ls -lh "$BIN"

    - name: Upload manual-build artifact
      if: github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v4
      with:
        name: WiFi-Monitor-${{ steps.compile.outputs.board_name }}
        path: ${{ steps.compile.outputs.bin_file }}
        if-no-files-found: error
        retention-days: 14

    - name: Upload firmware to release
      if: github.event_name == 'release'
      uses: softprops/action-gh-release@v3
      with:
        tag_name: ${{ github.event.release.tag_name }}
        files: firmware/*.bin
        overwrite_files: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
