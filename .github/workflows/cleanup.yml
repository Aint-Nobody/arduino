name: Repository Cleanup

"on":
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  cleanup:
    name: Delete old source, BIN assets, and workflow runs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Delete old INO and IN files, keeping the two newest
        shell: bash
        run: |
          set -euo pipefail

          CUTOFF=$(( $(date +%s) - 259200 ))
          DELETED=0
          declare -a FILES=()
          declare -a TIMES=()

          while IFS= read -r -d '' FILE; do
            LAST_CHANGE=$(git log -1 --format=%ct -- "$FILE")
            if [[ -n "$LAST_CHANGE" ]]; then
              FILES+=("$FILE")
              TIMES+=("$LAST_CHANGE")
            fi
          done < <(git ls-files -z -- '*.ino' '*.in')

          # Sort by last Git change, newest first; always preserve the first two.
          if [[ ${#FILES[@]} -gt 0 ]]; then
            mapfile -t ORDERED < <(
              for i in "${!FILES[@]}"; do
                printf '%s\t%s\n' "${TIMES[$i]}" "${FILES[$i]}"
              done | sort -rn -k1,1
            )

            RANK=0
            for ENTRY in "${ORDERED[@]}"; do
              RANK=$((RANK + 1))
              FILE=${ENTRY#*$'\t'}
              LAST_CHANGE=${ENTRY%%$'\t'*}

              if [[ "$RANK" -le 2 ]]; then
                printf 'Keeping one of the two newest source/archive files: %s\n' "$FILE"
                continue
              fi

              if [[ "$LAST_CHANGE" -lt "$CUTOFF" ]]; then
                printf 'Deleting old source/archive file: %s\n' "$FILE"
                git rm -- "$FILE"
                DELETED=$((DELETED + 1))
              fi
            done
          fi

          if [[ "$DELETED" -gt 0 ]]; then
            git commit -m "Cleanup: delete INO and IN files older than 3 days"
            git push origin "HEAD:${GITHUB_REF_NAME}"
            echo "Deleted INO and IN files: $DELETED"
          else
            echo "No eligible INO or IN files older than 3 days found."
          fi

      - name: Delete old BIN release assets, keeping the two newest
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 259200000;
            const releases = await github.paginate(
              github.rest.repos.listReleases,
              { owner: context.repo.owner, repo: context.repo.repo, per_page: 100 }
            );

            const binAssets = [];
            for (const release of releases) {
              const assets = await github.paginate(
                github.rest.repos.listReleaseAssets,
                {
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  release_id: release.id,
                  per_page: 100
                }
              );
              for (const asset of assets) {
                if (asset.name.toLowerCase().endsWith('.bin')) {
                  binAssets.push({ ...asset, releaseTag: release.tag_name });
                }
              }
            }

            binAssets.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            let deleted = 0;

            for (const [index, asset] of binAssets.entries()) {
              if (index < 2) {
                core.info(`Keeping one of the two newest BIN assets: ${asset.name} (${asset.created_at})`);
                continue;
              }

              const uploadedAt = Date.parse(asset.created_at);
              if (!Number.isFinite(uploadedAt) || uploadedAt >= cutoff) continue;

              core.info(`Deleting ${asset.name} from release ${asset.releaseTag} (uploaded: ${asset.created_at})`);
              await github.rest.repos.deleteReleaseAsset({
                owner: context.repo.owner,
                repo: context.repo.repo,
                asset_id: asset.id
              });
              deleted++;
            }

            core.info(`Deleted BIN release assets: ${deleted}`);
            core.info('Release entries and tags have not been deleted.');

      - name: Delete old Actions workflow runs, keeping the two newest
        uses: actions/github-script@v7
        with:
          script: |
            const cutoff = Date.now() - 259200000;
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            // API results are normally newest-first; sort explicitly by creation time.
            runs.sort((a, b) => Date.parse(b.created_at) - Date.parse(a.created_at));
            let deleted = 0;

            for (const [index, run] of runs.entries()) {
              if (index < 2) {
                core.info(`Keeping one of the two newest Actions runs: #${run.id} (${run.created_at})`);
                continue;
              }

              const createdAt = Date.parse(run.created_at);
              if (!Number.isFinite(createdAt) || createdAt >= cutoff) continue;

              core.info(`Deleting old Actions run #${run.id} (${run.name}, ${run.created_at})`);
              await github.rest.actions.deleteWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id
              });
              deleted++;
            }

            core.info(`Deleted Actions workflow runs: ${deleted}`);
