name: Repository Cleanup

on:
workflow_dispatch:

permissions:
contents: write

jobs:
cleanup:
name: Delete old INO and BIN files
runs-on: ubuntu-latest

steps:
  - name: Checkout repository
    uses: actions/checkout@v4
    with:
      fetch-depth: 0

  - name: Configure Git
    run: |
      git config user.name "github-actions[bot]"
      git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

  - name: Delete INO files older than 3 days
    shell: bash
    run: |
      set -euo pipefail

      CUTOFF=$(( $(date +%s) - 259200 ))
      DELETED=0

      while IFS= read -r -d '' FILE; do
        LAST_CHANGE=$(git log -1 --format=%ct -- "$FILE")

        if [[ -n "$LAST_CHANGE" && "$LAST_CHANGE" -lt "$CUTOFF" ]]; then
          printf 'Deleting INO: %s\n' "$FILE"
          git rm -- "$FILE"
          DELETED=$((DELETED + 1))
        fi
      done < <(git ls-files -z -- '*.ino')

      if [[ "$DELETED" -gt 0 ]]; then
        git commit -m "Cleanup: delete INO files older than 3 days"
        git push origin "HEAD:${GITHUB_REF_NAME}"
        echo "Deleted INO files: $DELETED"
      else
        echo "No INO files older than 3 days found."
      fi

  - name: Delete BIN release assets older than 3 days
    uses: actions/github-script@v7
    with:
      script: |
        const cutoff = Date.now() - 259200000;

        const releases = await github.paginate(
          github.rest.repos.listReleases,
          {
            owner: context.repo.owner,
            repo: context.repo.repo,
            per_page: 100
          }
        );

        let deleted = 0;

        for (const release of releases) {
          const assets = await github.paginate(
            github.rest.repos.listReleaseAssets,
            {
              owner: context.repo.owner,
              repo: context.repo.repo,
              release_id: release.id,
              per_page: 100
            }
          );

          for (const asset of assets) {
            if (!asset.name.toLowerCase().endsWith('.bin')) {
              continue;
            }

            const uploadedAt = Date.parse(asset.created_at);

            if (!Number.isFinite(uploadedAt) || uploadedAt >= cutoff) {
              continue;
            }

            core.info(
              `Deleting ${asset.name} from release ${release.tag_name} ` +
              `(uploaded: ${asset.created_at})`
            );

            await github.rest.repos.deleteReleaseAsset({
              owner: context.repo.owner,
              repo: context.repo.repo,
              asset_id: asset.id
            });

            deleted++;
          }
        }

        core.info(`Deleted BIN release assets: ${deleted}`);
        core.info('Release entries and tags have not been deleted.');
